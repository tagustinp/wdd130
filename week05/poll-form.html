<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll Form Exercise</title>
    <link rel="stylesheet" href="styles/">
</head>

<body>
    <header></header>
    <main>
        <form>
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required>
            <label for="useremail">Email:</label>
            <input type="email" id="useremail" name="useremail" required>
            <label for="browser">What is your favorite browser?</label>
            <select name="browser" id="browser">
                <option value="1">Chrome</option>
                <option value="2">Safari</option>
                <option value="3">Edge</option>
                <option value="4">Brave</option>
                <option value="5">Duck Duck Go</option>
                <option value="6">Other</option>
            </select>
            <label><input type="checkbox" id="pet" name="pet">Do you have a household pet?</label>
            <label for="feedback">List the places you have lived</label>
            <textarea id="feedback" name="feedback" rows="4"></textarea>
            <button type="submit">Submit poll</button>
        </form>
    </main>
    <footer></footer>
</body>
